name: Release

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch or ref to release from. Use the MVP branch until it is merged.'
        required: true
        default: 'codex/feat-mvp-router-core'
        type: string
      bump:
        description: 'Semver bump to apply when version is empty'
        required: true
        default: 'patch'
        type: choice
        options:
          - 'patch'
          - 'minor'
          - 'major'
      version:
        description: 'Exact x.y.z version; overrides bump when set'
        required: false
        type: string
      notes:
        description: 'Optional extra changelog note(s); one bullet per line. Leave empty when Unreleased already has notes.'
        required: false
        type: string
      validation_summary:
        description: 'Optional release validation summary. Include real-provider and dogfood status for MVP candidate releases.'
        required: false
        type: string
      validation_evidence:
        description: 'Optional evidence references: acceptance directory names, request ids, provider matrix snapshots, or artifact URLs.'
        required: false
        type: string
      known_gaps:
        description: 'Optional known gaps or blocked provider-auth steps; one item per line is easiest to scan.'
        required: false
        type: string
      dry_run:
        description: 'Validate only; do not commit or tag'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.target_ref || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Bump, Test, Tag, and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare release files
        id: prepare
        env:
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes || '' }}
        run: |
          node scripts/prepare-release.mjs
          git diff -- package.json package-lock.json CHANGELOG.md

      - name: Ensure release is new
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "Tag v${VERSION} already exists." >&2
            exit 1
          fi
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${VERSION} already exists on npm." >&2
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Check package metadata
        run: npm run check:package

      - name: Commit and tag release
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git add package.json package-lock.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No release file changes to commit." >&2
            exit 1
          fi
          git commit -m "chore(release): v${VERSION}"
          git tag "v${VERSION}"
          git push origin "HEAD:${{ inputs.target_ref }}" "refs/tags/v${VERSION}"

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${VERSION} already exists on npm; skipping publish."
          else
            npm publish --access public --provenance
          fi

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          VALIDATION_SUMMARY: ${{ inputs.validation_summary || '' }}
          VALIDATION_EVIDENCE: ${{ inputs.validation_evidence || '' }}
          KNOWN_GAPS: ${{ inputs.known_gaps || '' }}
        run: |
          NOTES_FILE="$(mktemp)"
          awk -v version="$VERSION" '
            $1 == "##" && $2 == version {capture=1; next}
            capture && /^## / {exit}
            capture {print}
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            printf 'Release v%s\n' "$VERSION" > "$NOTES_FILE"
          fi
          append_release_section() {
            title="$1"
            content="$2"
            fallback="$3"
            {
              echo
              echo "## ${title}"
              echo
            } >> "$NOTES_FILE"
            if [ -n "$(printf '%s' "$content" | tr -d '[:space:]')" ]; then
              printf '%s\n' "$content" >> "$NOTES_FILE"
            else
              printf '%s\n' "$fallback" >> "$NOTES_FILE"
            fi
          }
          append_release_section \
            "Validation Summary" \
            "$VALIDATION_SUMMARY" \
            "Automated release workflow completed install, build, typecheck, tests, npm pack dry-run, and package metadata checks. Final MVP acceptance still requires reviewed local provider and dogfood evidence."
          append_release_section \
            "Validation Evidence" \
            "$VALIDATION_EVIDENCE" \
            "No acceptance evidence directory, provider matrix snapshot, or request ids were provided at dispatch time."
          append_release_section \
            "Known Gaps" \
            "$KNOWN_GAPS" \
            "No known gaps or blocked provider-auth steps were provided at dispatch time."
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "v${VERSION}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "v${VERSION}" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "v${VERSION}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "v${VERSION}" \
              --notes-file "$NOTES_FILE" \
              --verify-tag
          fi

      - name: Write summary
        if: always()
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Release workflow"
            echo
            echo "- Version: v${VERSION:-unknown}"
            echo "- Dry run: ${DRY_RUN}"
            echo "- Workflow ref: ${GITHUB_REF_NAME}"
            echo "- Target ref: ${{ inputs.target_ref }}"
            echo "- Validation summary provided: ${{ inputs.validation_summary != '' }}"
            echo "- Validation evidence provided: ${{ inputs.validation_evidence != '' }}"
            echo "- Known gaps provided: ${{ inputs.known_gaps != '' }}"
            if [ "${DRY_RUN}" != "true" ] && [ -n "${VERSION}" ]; then
              echo "- Published: npm package and GitHub Release for v${VERSION}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
