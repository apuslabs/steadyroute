name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump to apply when version is empty'
        required: true
        default: 'patch'
        type: choice
        options:
          - 'patch'
          - 'minor'
          - 'major'
      version:
        description: 'Exact x.y.z version; overrides bump when set'
        required: false
        type: string
      notes:
        description: 'Changelog note(s); one bullet per line'
        required: true
        type: string
      dry_run:
        description: 'Validate only; do not commit, tag, publish, or create a GitHub Release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Bump, Test, Tag, and Publish
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare release files
        id: prepare
        env:
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          node scripts/prepare-release.mjs
          git diff -- package.json package-lock.json CHANGELOG.md

      - name: Ensure release is new
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "Tag v${VERSION} already exists." >&2
            exit 1
          fi
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${VERSION} already exists on npm." >&2
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Check package metadata
        run: npm run check:package

      - name: Commit and tag release
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git add package.json package-lock.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No release file changes to commit." >&2
            exit 1
          fi
          git commit -m "chore(release): v${VERSION}"
          git tag "v${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/v${VERSION}"

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists on npm; skipping publish."
          else
            npm publish --access public --provenance
          fi

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          NOTES_FILE="$(mktemp)"
          awk -v version="${VERSION}" '
            $1 == "##" && $2 == version {capture=1; next}
            capture && /^## / {exit}
            capture {print}
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            printf 'Release v%s\n' "${VERSION}" > "$NOTES_FILE"
          fi
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "v${VERSION}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "v${VERSION}" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "v${VERSION}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "v${VERSION}" \
              --notes-file "$NOTES_FILE" \
              --verify-tag
          fi

      - name: Write summary
        if: always()
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Release workflow"
            echo
            echo "- Version: v${VERSION:-unknown}"
            echo "- Dry run: ${DRY_RUN}"
            echo "- Ref: ${GITHUB_REF_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"
